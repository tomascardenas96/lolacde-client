name: CI

on:
  # Sin filtro de base: asi tambien corre en PRs apilados, que apuntan a otra
  # rama y no a main.
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # next build ya typechequea, pero un paso propio falla antes y dice
      # exactamente qué tipo no cierra, en vez de morir dentro del build.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
